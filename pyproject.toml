[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-evals"
version = "0.1.0"
description = "Reference-grounded LLM answer evaluation workflows built with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-anyllm>=0.0.1a2,<0.1",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
examples = ["tqdm>=4.66,<5"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ui = ["streamlit>=1.40,<2", "pandas>=2.2,<3"]
dev = ["pytest>=8,<10"]
all = [
  "tqdm>=4.66,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "streamlit>=1.40,<2",
  "pandas>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
